<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>Issue Editor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      max-width: 700px;
      margin: auto;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
  </style>
</head>

<body>

  <h2>Rediģēt ierakstu</h2>

  <label>Issue Description</label>
  <textarea id="issue_description"></textarea>

  <label>Resolution</label>
  <textarea id="resolution"></textarea>

  <label>Responsibility</label>
  <input id="responsibility" type="text" />

  <label>Estimated Resolution Date</label>
  <input id="estimated_resolution_date" type="text" />

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <label>Priority</label>
  <select id="priority">
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>

  <button onclick="saveChanges()">Saglabāt izmaiņas</button>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const issueId = params.get('id');

    const API_URL =
      'https://desktop-96jgsq1.tailbed39b.ts.net/webhook/telegram-issue-editor';

    const UPDATE_URL =
      'https://desktop-96jgsq1.tailbed39b.ts.net/webhook/telegram-issue-editor-update';


    async function loadIssue() {
      if (!issueId) {
        alert('Issue ID nav atrasts');
        return;
      }

      try {
        const url =
          `${API_URL}?id=${encodeURIComponent(issueId)}&initData=${encodeURIComponent(tg.initData)}`;

        const response = await fetch(url);

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`HTTP ${response.status}: ${text}`);
        }

        const raw = await response.json();

        // n8n может вернуть как объект, так и массив с одним объектом
        const data = Array.isArray(raw) ? raw[0] : raw;

        if (!data) {
          throw new Error('Empty response from n8n');
        }

        document.getElementById('issue_description').value =
          data.issue_description ?? '';

        document.getElementById('resolution').value =
          data.resolution ?? '';

        document.getElementById('responsibility').value =
          data.responsibility ?? '';

        document.getElementById('estimated_resolution_date').value =
          data.estimated_resolution_date ?? '';

        document.getElementById('notes').value =
          data.notes ?? '';

        document.getElementById('priority').value =
          data.priority ?? 'Low';

      } catch (error) {
        console.error(error);

        alert(
          'Neizdevās ielādēt ierakstu\n\n' +
          String(error.message || error)
        );
      }
    }


    async function saveChanges() {
      if (!issueId) {
        alert('Issue ID nav atrasts');
        return;
      }

      const data = {
        id: issueId,
        initData: tg.initData,

        issue_description:
          document.getElementById('issue_description').value,

        resolution:
          document.getElementById('resolution').value,

        responsibility:
          document.getElementById('responsibility').value,

        estimated_resolution_date:
          document.getElementById('estimated_resolution_date').value,

        notes:
          document.getElementById('notes').value,

        priority:
          document.getElementById('priority').value
      };

      try {
        const response = await fetch(UPDATE_URL, {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`HTTP ${response.status}: ${text}`);
        }

        const raw = await response.json();

        const result =
          Array.isArray(raw) ? raw[0] : raw;

        if (result && result.success) {
          tg.close();
        } else {
          throw new Error(
            'Server response does not contain success=true'
          );
        }

      } catch (error) {
        console.error(error);

        alert(
          'Neizdevās saglabāt izmaiņas\n\n' +
          String(error.message || error)
        );
      }
    }


    loadIssue();
  </script>

</body>
</html>
